<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>韭韭归一 · 智能控制中枢</title>
    <!-- 已移除 Font Awesome 图形库，完全采用简约文字+科技感视觉 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 明亮清澈的全局背景 - 清新渐变，科技感明亮 */
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Poppins', sans-serif;
            background: linear-gradient(145deg, #e0eaf5 0%, #c8d9ec 100%);
            /* 清澈水光感，凸显卡片明亮 */
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* 主卡片 - 明亮毛玻璃 + 清澈微光边框（用户定制） */
        .card {
            background: rgba(228, 234, 237, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(80, 100, 120, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.6);
            width: 100%;
            max-width: 560px;
            height: 95vh;
            display: flex;
            flex-direction: column;
            padding: 16px 18px;
            transition: all 0.2s ease;
        }

        /* 标题区 - 深邃但不失清爽 */
        h1 {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #1c5a8a, #2e4a7c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 4px;
            letter-spacing: 1.5px;
        }

        .subtitle {
            color: #4a627a;
            font-size: 12px;
            text-align: center;
            margin-bottom: 12px;
            font-weight: 500;
            opacity: 0.85;
        }

        /* 状态栏 - 清新半透明，深色文字 */
        .status-bar {
            padding: 8px 12px;
            border-radius: 28px;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            flex-shrink: 0;
            background: rgba(245, 250, 255, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(70, 130, 200, 0.2);
            color: #1e3a5f;
        }

        .status-idle {
            background: rgba(235, 242, 250, 0.8);
            color: #2c5282;
            border-left: 3px solid #3b82f6;
        }

        .status-success {
            background: rgba(215, 245, 225, 0.85);
            color: #1f6e43;
            border-left: 3px solid #2bce7a;
        }

        .status-error {
            background: rgba(255, 225, 220, 0.85);
            color: #bc3f2e;
            border-left: 3px solid #ff6b5e;
        }

        /* 控制面板网格 - 垂直科技排列 */
        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            justify-content: space-evenly;
            overflow-y: auto;
            padding-right: 3px;
        }

        /* 细窄滚动条 */
        .grid-container::-webkit-scrollbar {
            width: 4px;
        }
        .grid-container::-webkit-scrollbar-track {
            background: #cfdfef;
            border-radius: 4px;
        }
        .grid-container::-webkit-scrollbar-thumb {
            background: #5f9eff;
            border-radius: 4px;
        }

        /* 控制模块 - 明亮卡片内嵌，玻璃质感 */
        .control-module {
            display: flex;
            flex-direction: row;
            align-items: center;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
            gap: 12px;
            flex: 1;
            min-height: 70px;
        }

        .control-module:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: #9ac2e0;
            box-shadow: 0 6px 14px rgba(60, 110, 150, 0.1);
        }

        /* 滑块区域 */
        .slider-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        /* 清新滑块 */
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 8px;
            background: #cbdbe6;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2c6e9e;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
            transition: 0.1s;
        }
        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #1f85c9;
        }
        .slider:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .slider:disabled::-webkit-slider-thumb {
            background: #8fabbd;
            box-shadow: none;
        }

        /* 数值显示标签 - 清澈科技感 */
        .val-display {
            background: #eef3fc;
            color: #1f6392;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 11px;
            text-align: center;
            min-width: 44px;
            border: 0.5px solid #bbd4f0;
            align-self: flex-end;
        }

        /* 右侧控制按钮 - 明亮主题保留活力渐变，OFF时变灰 */
        .module-btn {
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border: none;
            min-width: 100px;
            background: linear-gradient(135deg, #3478b0, #215d8a);
            color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .module-btn:active {
            transform: scale(0.96);
        }

        /* 各模块活跃配色 (明亮清澈但保持辨识度) */
        .module-btn.bg-1 { background: linear-gradient(135deg, #2c7cb6, #1d6191); }
        .module-btn.bg-2 { background: linear-gradient(135deg, #c95c5c, #a54343); }
        .module-btn.bg-3 { background: linear-gradient(135deg, #38a169, #2c7a5a); }
        .module-btn.bg-4 { background: linear-gradient(135deg, #6d6fc7, #504d9e); }
        .module-btn.bg-5 { background: linear-gradient(135deg, #de9036, #b86e28); }
        .module-btn.bg-6 { background: linear-gradient(135deg, #319795, #237a78); }

        /* OFF状态：统一高级灰，完全满足“按钮变成OFF时，颜色变灰” */
        .module-btn.off {
            background: linear-gradient(135deg, #98a9bc, #7b8a9e);
            opacity: 0.85;
            color: #f0f3f8;
            box-shadow: none;
            border: 0.5px solid #cbd5e1;
        }

        /* 状态文本 ON/OFF 样式 */
        .state-text {
            font-size: 10px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 10px;
            border-radius: 30px;
            letter-spacing: 0.5px;
        }

        /* 密码区域 - 明亮底部 */
        .password-container {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(100, 140, 180, 0.35);
            flex-shrink: 0;
        }

        .password-input {
            width: 100%;
            padding: 10px 16px;
            margin: 6px 0;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #bfd6ec;
            border-radius: 48px;
            font-size: 14px;
            color: #1f4468;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }

        .password-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
            background: white;
        }

        .unlock-btn {
            width: 100%;
            padding: 10px 0;
            background: linear-gradient(95deg, #2c7cb6, #1f5f8e);
            color: white;
            border: none;
            border-radius: 48px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.5px;
        }

        .unlock-btn:active {
            transform: scale(0.97);
        }

        /* 简洁文字，无任何图标库 */
    </style>
</head>
<body>

<div class="card">
    <!-- 标题区 -->
    <h1>韭韭归一</h1>
    <p class="subtitle">· 智控中枢 · 密码解锁</p>

    <!-- 状态信息栏 -->
    <div id="status" class="status-bar status-idle">
        等待指令...
    </div>
    <div id="recv" class="status-bar status-idle" style="display: none;">
        未接收到消息
    </div>

    <!-- 控制面板：6个设备模块（已移除紧急停止模块） -->
    <div id="controlGrid" style="display: none;" class="grid-container">

        <!-- 模块1：多轴联动 -->
        <div class="control-module">
            <div class="slider-section">
                <input type="range" min="0" max="100" value="0" class="slider" id="slider-1" oninput="updateSlider(1)" disabled>
                <span class="val-display" id="val-1">0</span>
            </div>
            <button class="module-btn bg-1 off" data-index="1" onclick="toggleDevice(1)">
                多轴联动
                <span class="state-text" id="state-1">OFF</span>
            </button>
        </div>

        <!-- 模块2：八连杆工作台 -->
        <div class="control-module">
            <div class="slider-section">
                <input type="range" min="0" max="100" value="0" class="slider" id="slider-2" oninput="updateSlider(2)" disabled>
                <span class="val-display" id="val-2">0</span>
            </div>
            <button class="module-btn bg-2 off" data-index="2" onclick="toggleDevice(2)">
                八连杆工作台
                <span class="state-text" id="state-2">OFF</span>
            </button>
        </div>

        <!-- 模块3：风刀去土 -->
        <div class="control-module">
            <div class="slider-section">
                <input type="range" min="0" max="100" value="0" class="slider" id="slider-3" oninput="updateSlider(3)" disabled>
                <span class="val-display" id="val-3">0</span>
            </div>
            <button class="module-btn bg-3 off" data-index="3" onclick="toggleDevice(3)">
                风刀去土
                <span class="state-text" id="state-3">OFF</span>
            </button>
        </div>

        <!-- 模块4：视觉模块 -->
        <div class="control-module">
            <div class="slider-section">
                <input type="range" min="0" max="100" value="0" class="slider" id="slider-4" oninput="updateSlider(4)" disabled>
                <span class="val-display" id="val-4">0</span>
            </div>
            <button class="module-btn bg-4 off" data-index="4" onclick="toggleDevice(4)">
                视觉模块
                <span class="state-text" id="state-4">OFF</span>
            </button>
        </div>

        <!-- 模块5：打捆机构 -->
        <div class="control-module">
            <div class="slider-section">
                <input type="range" min="0" max="100" value="0" class="slider" id="slider-5" oninput="updateSlider(5)" disabled>
                <span class="val-display" id="val-5">0</span>
            </div>
            <button class="module-btn bg-5 off" data-index="5" onclick="toggleDevice(5)">
                打捆机构
                <span class="state-text" id="state-5">OFF</span>
            </button>
        </div>

        <!-- 模块6：传送带 -->
        <div class="control-module">
            <div class="slider-section">
                <input type="range" min="0" max="100" value="0" class="slider" id="slider-6" oninput="updateSlider(6)" disabled>
                <span class="val-display" id="val-6">0</span>
            </div>
            <button class="module-btn bg-6 off" data-index="6" onclick="toggleDevice(6)">
                传送带
                <span class="state-text" id="state-6">OFF</span>
            </button>
        </div>
    </div>

    <!-- 密码解锁区 -->
    <div class="password-container" id="pwdContainer">
        <input type="password" id="pwdInput" class="password-input" placeholder="输入安全密码">
        <button class="unlock-btn" onclick="checkPassword()">🔓 解锁面板</button>
    </div>
</div>

<script>
    // ======================== 系统配置区 =========================
    // 说明：以下为巴法云物联网配置参数，请勿随意修改，如需变更请同步更新云端。
    const PASSWORD = "050910Crn!";        // 控制面板解锁密码 (可自行修改)
    const CONFIG = { 
        uid: "6a51cf8f297040f9b8551ebee8020c1c",   // 巴法云用户私密UID
        topic: "machine006",                        // 设备主题，用于MQTT消息分发
        type: 1                                     // 消息类型 (1: 普通消息)
    };

    // ---------- 辅助函数：更新云端状态显示（轮询获取最新指令回显）----------
    async function pollUpdates() {
        const recvEl = document.getElementById('recv');
        recvEl.style.display = 'block';
        const requestUrl = `https://apis.bemfa.com/va/getmsg?uid=${CONFIG.uid}&type=${CONFIG.type}&topic=${CONFIG.topic}`;
        try {
            const response = await fetch(requestUrl);
            const data = await response.json();
            if (data.code === 0 && data.data && data.data.length > 0) {
                const realMsg = data.data[0].msg;
                recvEl.innerHTML = `📡 当前状态: ${realMsg}`;
                recvEl.className = 'status-bar status-success';
            } else {
                recvEl.innerHTML = `⏳ 当前状态: 无数据`;
                recvEl.className = 'status-bar status-idle';
            }
        } catch (err) {
            recvEl.innerHTML = `⚠️ 状态获取失败，稍后重试`;
            recvEl.className = 'status-bar status-error';
        }
    }

    // ---------- 核心指令发送模块 (巴法云API) ----------
    async function sendCommand(msg, desc) {
        const statusEl = document.getElementById('status');
        statusEl.innerHTML = `⟳ 发送中: ${desc}`;
        statusEl.className = 'status-bar status-idle';
        
        try {
            const response = await fetch('https://apis.bemfa.com/va/postJsonMsg', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    uid: CONFIG.uid, 
                    topic: CONFIG.topic, 
                    type: CONFIG.type, 
                    msg: msg, 
                    wemsg: desc 
                })
            });
            const result = await response.json();
            
            if (result.code === 0) {
                statusEl.innerHTML = `✔ 成功: ${desc}`;
                statusEl.className = 'status-bar status-success';
                pollUpdates();
            } else {
                throw new Error(result.message || "云端返回失败码");
            }
        } catch (error) {
            statusEl.innerHTML = `✖ 失败: ${error.message}`;
            statusEl.className = 'status-bar status-error';
        }
    }

    // ---------- 设备开关控制 ----------
    function toggleDevice(index) {
        const btn = document.querySelector(`.module-btn[data-index="${index}"]`);
        const stateText = document.getElementById(`state-${index}`);
        const slider = document.getElementById(`slider-${index}`);
        const currentValue = slider.value;

        if (btn.classList.contains('off')) {
            btn.classList.remove('off');
            stateText.textContent = 'ON';
            slider.disabled = false;
            sendCommand(`M${index}_${currentValue}`, `设备${index} 开启 (数值:${currentValue})`);
        } else {
            btn.classList.add('off');
            stateText.textContent = 'OFF';
            slider.disabled = true;
            sendCommand(`M${index}_0`, `设备${index} 已关闭`);
        }
    }

    // ---------- 滑块调节 ----------
    function updateSlider(index) {
        const slider = document.getElementById(`slider-${index}`);
        const valDisplay = document.getElementById(`val-${index}`);
        const value = parseInt(slider.value);
        valDisplay.textContent = value;
        
        const btn = document.querySelector(`.module-btn[data-index="${index}"]`);
        if (!btn.classList.contains('off')) {
            sendCommand(`M${index}_${value}`, `设备${index} 调节至 ${value}`);
        }
    }

    // ---------- 密码验证与面板解锁 ----------
    function checkPassword() {
        const pwdInput = document.getElementById('pwdInput');
        if (pwdInput.value === PASSWORD) {
            document.getElementById('pwdContainer').style.display = 'none';
            const grid = document.getElementById('controlGrid');
            grid.style.display = 'flex';
            pollUpdates();
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = '🔓 已解锁 · 可控制设备';
            statusEl.className = 'status-bar status-success';
            setTimeout(() => {
                if (statusEl.innerHTML.includes('已解锁')) {
                    statusEl.innerHTML = '✅ 系统就绪，可发送指令';
                }
            }, 2000);
        } else {
            alert('访问拒绝：密码错误');
            pwdInput.value = '';
            pwdInput.focus();
        }
    }

    // ---------- 初始化滑块显示 (1~6) ----------
    function initSlidersDisplay() {
        for (let i = 1; i <= 6; i++) {
            const slider = document.getElementById(`slider-${i}`);
            const valSpan = document.getElementById(`val-${i}`);
            if (slider && valSpan) {
                valSpan.textContent = slider.value;
            }
        }
    }

    initSlidersDisplay();

    // ---------- 自动轮询（解锁后启动）----------
    let pollingInterval = null;
    function startAutoPolling() {
        if (pollingInterval) clearInterval(pollingInterval);
        pollingInterval = setInterval(() => {
            const grid = document.getElementById('controlGrid');
            if (grid && grid.style.display === 'flex') {
                pollUpdates();
            }
        }, 18000);
    }

    // 重写 checkPassword 以支持自动轮询
    const originalCheck = checkPassword;
    window.checkPassword = function() {
        originalCheck();
        if (document.getElementById('pwdContainer').style.display === 'none') {
            startAutoPolling();
        }
    };
</script>
</body>
</html>
